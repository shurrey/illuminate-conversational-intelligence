# Canonical metrics for the real Illuminate catalog, Snowflake CDM schema.
#
# This file is the target artifact for migration into illuminate-conversational-
# intelligence. It mirrors the prototype's canonical/metrics.yaml structure but:
#   - Uses Snowflake-native SQL (ILIKE, COUNT(*) OVER(), fully-qualified table names).
#   - References the CDM_LMS schema (PERSON, COURSE, TERM, PERSON_COURSE, GRADE).
#   - Templates the database name via Jinja `{{ database }}` — the engine must
#     pass this when rendering (one new kwarg in compile_sql when ported).
#
# Source: 12 metric-shaped entries from `verified_queries.json` in the CI repo
# (skipped: `list schemas`, `list tables in CDM_LMS` — catalog-browse utilities,
# not metrics).
#
# Each metric below records `originally:` for traceability back to the verified
# query intent it replaces. That field is non-semantic — for human auditors only.

metrics:

  - id: metric.student_count.v1
    version: "1.0.0"
    display_name: Student count
    description: >
      Total count of persons whose institution role is 'S' (student).
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Person
    originally: "total student count"
    measure_sql: |
      SELECT COUNT(*) AS STUDENT_COUNT
      FROM {{ database }}.CDM_LMS.PERSON
      WHERE INSTITUTION_ROLE = 'S'
      {% if where %}AND {{ where }}{% endif %}
    default_filters: []
    valid_dimensions: []
    synonyms: ["how many students", "student count", "total students", "number of students", "total enrollment"]
    example_questions:
      - "How many students are at this institution?"
      - "What's our student count?"

  - id: metric.instructor_count.v1
    version: "1.0.0"
    display_name: Instructor count
    description: >
      Total count of persons whose institution role is 'I' (instructor).
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Person
    originally: "instructor count"
    measure_sql: |
      SELECT COUNT(*) AS INSTRUCTOR_COUNT
      FROM {{ database }}.CDM_LMS.PERSON
      WHERE INSTITUTION_ROLE = 'I'
      {% if where %}AND {{ where }}{% endif %}
    default_filters: []
    valid_dimensions: []
    synonyms: ["how many instructors", "instructor count", "number of instructors", "total instructors", "how many teachers", "faculty count"]
    example_questions:
      - "How many instructors do we have?"
      - "What's our faculty count?"

  - id: metric.course_count.v1
    version: "1.0.0"
    display_name: Course count
    description: >
      Total count of all courses in the system. Returns a single scalar; see
      metric.active_courses.by_term.v1 for the per-term view.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Course
    originally: "total course count"
    measure_sql: |
      SELECT COUNT(*) AS COURSE_COUNT
      FROM {{ database }}.CDM_LMS.COURSE
      {% if where %}WHERE {{ where }}{% endif %}
    default_filters: []
    valid_dimensions: []
    synonyms: ["how many courses", "course count", "total courses", "number of courses"]
    example_questions:
      - "How many courses do we have?"
      - "Total course count"

  - id: metric.active_courses.by_term.v1
    version: "1.0.0"
    display_name: Active courses by term
    description: >
      Number of distinct active courses grouped by term, joined through COURSE.TERM_ID.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Course
    originally: "active courses by term"
    measure_sql: |
      SELECT t.NAME AS TERM_NAME,
             COUNT(DISTINCT c.COURSE_ID) AS COURSE_COUNT
      FROM {{ database }}.CDM_LMS.COURSE c
      JOIN {{ database }}.CDM_LMS.TERM t ON c.TERM_ID = t.TERM_ID
      {% if where %}WHERE {{ where }}{% endif %}
      GROUP BY t.NAME
      ORDER BY t.NAME
      LIMIT 100
    default_filters: []
    valid_dimensions: []
    synonyms: ["active courses", "current courses", "courses this term", "courses by term"]
    example_questions:
      - "How many active courses are there in each term?"
      - "Show courses by term."

  - id: metric.enrollment_count.by_term.v1
    version: "1.0.0"
    display_name: Enrollment by term
    description: >
      Distinct student enrollment counts grouped by academic term.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Enrollment
    originally: "enrollment by term"
    measure_sql: |
      SELECT t.NAME AS TERM_NAME,
             COUNT(DISTINCT pc.PERSON_ID) AS ENROLLMENT_COUNT
      FROM {{ database }}.CDM_LMS.PERSON_COURSE pc
      JOIN {{ database }}.CDM_LMS.TERM t ON pc.TERM_ID = t.TERM_ID
      {% if where %}WHERE {{ where }}{% endif %}
      GROUP BY t.NAME
      ORDER BY t.NAME
      LIMIT 100
    default_filters: []
    valid_dimensions: []
    synonyms: ["enrollment by term", "students per term", "enrollment trends", "term enrollment", "enrollment over time"]
    example_questions:
      - "Show enrollment by term."
      - "How is enrollment trending over time?"

  - id: metric.enrollment_count.by_course.v1
    version: "1.0.0"
    display_name: Enrollment by course
    description: >
      Distinct student enrollment counts grouped by course, sorted descending.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Enrollment
    originally: "course enrollment counts"
    measure_sql: |
      SELECT c.NAME AS COURSE_NAME,
             COUNT(DISTINCT pc.PERSON_ID) AS ENROLLMENT_COUNT
      FROM {{ database }}.CDM_LMS.PERSON_COURSE pc
      JOIN {{ database }}.CDM_LMS.COURSE c ON pc.COURSE_ID = c.COURSE_ID
      {% if where %}WHERE {{ where }}{% endif %}
      GROUP BY c.NAME
      ORDER BY ENROLLMENT_COUNT DESC
      LIMIT 100
    default_filters: []
    valid_dimensions: []
    synonyms: ["students per course", "course enrollment", "enrollment by course", "popular courses", "largest courses"]
    example_questions:
      - "Which courses have the most students?"
      - "Show enrollment by course."

  - id: metric.enrollment_summary.v1
    version: "1.0.0"
    display_name: Enrollment summary statistics
    description: >
      High-level enrollment summary across the warehouse: total distinct students,
      total distinct courses, total enrollments, and average courses per student.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Enrollment
    originally: "enrollment summary statistics"
    measure_sql: |
      SELECT COUNT(DISTINCT PERSON_ID) AS TOTAL_STUDENTS,
             COUNT(DISTINCT COURSE_ID) AS TOTAL_COURSES,
             COUNT(*) AS TOTAL_ENROLLMENTS,
             ROUND(COUNT(*) * 1.0 / NULLIF(COUNT(DISTINCT PERSON_ID), 0), 1) AS AVG_COURSES_PER_STUDENT
      FROM {{ database }}.CDM_LMS.PERSON_COURSE
      {% if where %}WHERE {{ where }}{% endif %}
    default_filters: []
    valid_dimensions: []
    synonyms: ["enrollment statistics", "enrollment summary", "enrollment stats", "enrollment overview"]
    example_questions:
      - "Give me an enrollment overview."
      - "What's our enrollment summary?"

  - id: metric.average_gpa.v1
    version: "1.0.0"
    display_name: Average GPA (overall)
    description: >
      Overall mean of GRADE_NUMERIC across all graded records (4.0 scale).
      Note: GRADE_NUMERIC is the canonical 4.0-scale column. Do not substitute
      with normalized score columns — those are a different scale and not
      comparable to a GPA.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Grade
    originally: "average GPA"
    measure_sql: |
      SELECT ROUND(AVG(GRADE_NUMERIC), 2) AS AVERAGE_GPA,
             COUNT(DISTINCT PERSON_ID) AS DISTINCT_STUDENTS
      FROM {{ database }}.CDM_LMS.GRADE
      WHERE GRADE_NUMERIC IS NOT NULL
      {% if where %}AND {{ where }}{% endif %}
    default_filters: []
    valid_dimensions: []
    synonyms: ["average gpa", "mean gpa", "overall gpa", "gpa average", "what is the gpa", "what's the gpa"]
    example_questions:
      - "What's our average GPA?"
      - "Overall GPA across all students."

  - id: metric.average_gpa.by_term.v1
    version: "1.0.0"
    display_name: Average GPA by term
    description: >
      Mean GRADE_NUMERIC (4.0 scale) grouped by academic term, with the count
      of distinct students contributing to each term's average.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Grade
    originally: "GPA by term"
    measure_sql: |
      SELECT t.NAME AS TERM_NAME,
             ROUND(AVG(g.GRADE_NUMERIC), 2) AS AVERAGE_GPA,
             COUNT(DISTINCT g.PERSON_ID) AS DISTINCT_STUDENTS
      FROM {{ database }}.CDM_LMS.GRADE g
      JOIN {{ database }}.CDM_LMS.TERM t ON g.TERM_ID = t.TERM_ID
      WHERE g.GRADE_NUMERIC IS NOT NULL
      {% if where %}AND {{ where }}{% endif %}
      GROUP BY t.NAME
      ORDER BY t.NAME
      LIMIT 100
    default_filters: []
    valid_dimensions: []
    synonyms: ["gpa by term", "gpa trends", "gpa over time", "term gpa", "gpa per term", "gpa all terms", "gpa each term"]
    example_questions:
      - "How is GPA trending term over term?"
      - "Average GPA by term"

  - id: metric.average_gpa.for_term.v1
    version: "1.0.0"
    display_name: Average GPA for a specific term
    description: >
      Mean GRADE_NUMERIC (4.0 scale) for a single named term. Requires a
      `term_name` filter; the engine must pass it through to the WHERE clause.
      Until the engine supports parameter binding, callers can interpolate the
      term name into a filter SQL fragment (e.g. `t.NAME ILIKE '%Fall 2024%'`).
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Grade
    originally: "GPA for a specific term"
    measure_sql: |
      SELECT t.NAME AS TERM_NAME,
             ROUND(AVG(g.GRADE_NUMERIC), 2) AS AVERAGE_GPA,
             COUNT(DISTINCT g.PERSON_ID) AS DISTINCT_STUDENTS
      FROM {{ database }}.CDM_LMS.GRADE g
      JOIN {{ database }}.CDM_LMS.TERM t ON g.TERM_ID = t.TERM_ID
      WHERE g.GRADE_NUMERIC IS NOT NULL
      {% if where %}AND {{ where }}{% endif %}
      GROUP BY t.NAME
      ORDER BY t.NAME
    default_filters: []
    valid_dimensions: []
    synonyms: ["gpa for fall", "gpa for spring", "gpa fall 2024", "fall 2024 gpa", "spring 2024 gpa"]
    example_questions:
      - "What was our GPA in Fall 2024?"
      - "Show me the average GPA for Spring 2025."

  - id: metric.grade_distribution.v1
    version: "1.0.0"
    display_name: Grade distribution
    description: >
      Distribution of letter grades with raw counts and percentages of the total.
      Uses a window aggregate over COUNT(*) to compute the percentage.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Grade
    originally: "grade distribution"
    measure_sql: |
      SELECT GRADE_LETTER,
             COUNT(*) AS GRADE_COUNT,
             ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER(), 1) AS PERCENTAGE
      FROM {{ database }}.CDM_LMS.GRADE
      WHERE GRADE_LETTER IS NOT NULL
      {% if where %}AND {{ where }}{% endif %}
      GROUP BY GRADE_LETTER
      ORDER BY GRADE_LETTER
      LIMIT 100
    default_filters: []
    valid_dimensions: []
    synonyms: ["grade distribution", "grade breakdown", "letter grades", "grade counts", "how many as", "how many bs"]
    example_questions:
      - "What's our grade distribution?"
      - "Break down grades by letter."

  - id: metric.course_completion_rate.v1
    version: "1.0.0"
    display_name: Course completion rate
    description: >
      Percentage of enrollments per course with STATUS = 'COMPLETED', restricted
      to courses with at least 5 enrollments to avoid small-group noise and
      privacy concerns. Returns top 100 courses sorted by completion rate desc.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-21
    entity: Enrollment
    originally: "course completion rates"
    measure_sql: |
      SELECT c.NAME AS COURSE_NAME,
             COUNT(*) AS TOTAL_ENROLLED,
             SUM(CASE WHEN pc.STATUS = 'COMPLETED' THEN 1 ELSE 0 END) AS COMPLETED,
             ROUND(SUM(CASE WHEN pc.STATUS = 'COMPLETED' THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS COMPLETION_RATE
      FROM {{ database }}.CDM_LMS.PERSON_COURSE pc
      JOIN {{ database }}.CDM_LMS.COURSE c ON pc.COURSE_ID = c.COURSE_ID
      {% if where %}WHERE {{ where }}{% endif %}
      GROUP BY c.NAME
      HAVING COUNT(*) >= 5
      ORDER BY COMPLETION_RATE DESC
      LIMIT 100
    default_filters: []
    valid_dimensions: []
    synonyms: ["completion rate", "course completion", "pass rate", "success rate", "courses completed"]
    example_questions:
      - "Which courses have the highest completion rate?"
      - "What's our pass rate by course?"

  # ============================================================================
  # Dashboard metrics — single-row "current vs previous window" comparisons,
  # consumed by the KPI cards on the POC frontend. Output shape per metric:
  # one row with `current_*`, `previous_*`, and a diff/delta column. Ported
  # 1:1 from src/data/dashboardCards.ts in illuminate-poc-frontend. Schema
  # references use the Snowflake connection's default database (no
  # {{ database }} prefix), matching the existing dashboard_query endpoint.
  # ============================================================================

  - id: metric.dashboard.active_students.v1
    version: "1.0.0"
    display_name: Active Students (current vs previous term)
    description: >
      Distinct students enrolled (STUDENT_IND = TRUE, ACTIVE = '1') in courses
      belonging to the currently running academic term(s), compared to the most
      recently completed prior term. Returns current/previous counts and an
      absolute + percentage change. Originally the `total-enrollment` card.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-22
    entity: Person
    originally: "dashboard card: total-enrollment"
    measure_sql: |
      WITH current_terms AS (
        SELECT ID
        FROM CDM_LMS.TERM
        WHERE ROW_DELETED_TIME IS NULL
          AND START_TIME IS NOT NULL
          AND END_TIME IS NOT NULL
          AND CURRENT_TIMESTAMP() BETWEEN START_TIME AND END_TIME
      ),
      previous_terms AS (
        SELECT ID
        FROM CDM_LMS.TERM
        WHERE ROW_DELETED_TIME IS NULL
          AND END_TIME IS NOT NULL
          AND END_TIME < (SELECT MIN(START_TIME) FROM CDM_LMS.TERM
                          WHERE ID IN (SELECT ID FROM current_terms))
        QUALIFY ROW_NUMBER() OVER (ORDER BY END_TIME DESC) = 1
      ),
      current_students AS (
        SELECT COUNT(DISTINCT pc.PERSON_ID) AS student_count
        FROM CDM_LMS.PERSON_COURSE pc
        JOIN CDM_LMS.COURSE c
          ON c.ID = pc.COURSE_ID AND c.ROW_DELETED_TIME IS NULL
        WHERE c.TERM_ID IN (SELECT ID FROM current_terms)
          AND pc.STUDENT_IND = TRUE
          AND pc.ACTIVE = '1'
          AND pc.ROW_DELETED_TIME IS NULL
      ),
      previous_students AS (
        SELECT COUNT(DISTINCT pc.PERSON_ID) AS student_count
        FROM CDM_LMS.PERSON_COURSE pc
        JOIN CDM_LMS.COURSE c
          ON c.ID = pc.COURSE_ID AND c.ROW_DELETED_TIME IS NULL
        WHERE c.TERM_ID IN (SELECT ID FROM previous_terms)
          AND pc.STUDENT_IND = TRUE
          AND pc.ACTIVE = '1'
          AND pc.ROW_DELETED_TIME IS NULL
      )
      SELECT
        cs.student_count AS current_term_students,
        ps.student_count AS previous_term_students,
        cs.student_count - ps.student_count AS change_abs,
        ROUND(
          (cs.student_count - ps.student_count) * 100.0
          / NULLIF(ps.student_count, 0),
          2
        ) AS change_pct
      FROM current_students cs
      CROSS JOIN previous_students ps
    default_filters: []
    valid_dimensions: []
    synonyms: ["active students", "term-over-term enrollment"]
    example_questions:
      - "How many active students do we have this term vs last?"

  - id: metric.dashboard.retention_rate.v1
    version: "1.0.0"
    display_name: Retention Rate (rolling 90-day windows)
    description: >
      Percentage of students who enrolled in the previous 90-day window and
      returned for the current 90-day window. Uses rolling windows rather than
      academic terms. Originally the `retention-rate` card.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-22
    entity: Person
    originally: "dashboard card: retention-rate"
    measure_sql: |
      WITH windowed_enrollments AS (
        SELECT DISTINCT
          CASE
            WHEN pc.ENROLLMENT_TIME >= DATEADD('day', -90,  CURRENT_TIMESTAMP()) THEN 0
            WHEN pc.ENROLLMENT_TIME >= DATEADD('day', -180, CURRENT_TIMESTAMP()) THEN 1
            WHEN pc.ENROLLMENT_TIME >= DATEADD('day', -270, CURRENT_TIMESTAMP()) THEN 2
          END AS window_rank,
          pc.PERSON_ID
        FROM CDM_LMS.PERSON_COURSE pc
        WHERE pc.STUDENT_IND = TRUE
          AND pc.ROW_DELETED_TIME IS NULL
          AND pc.ENROLLMENT_TIME >= DATEADD('day', -270, CURRENT_TIMESTAMP())
      ),
      window_totals AS (
        SELECT window_rank, COUNT(DISTINCT PERSON_ID) AS student_count
        FROM windowed_enrollments
        GROUP BY window_rank
      ),
      retention AS (
        SELECT
          later.window_rank AS later_rank,
          COUNT(DISTINCT later.PERSON_ID) AS retained_students
        FROM windowed_enrollments later
        JOIN windowed_enrollments earlier
          ON later.PERSON_ID = earlier.PERSON_ID
         AND earlier.window_rank = later.window_rank + 1
        WHERE later.window_rank IN (0, 1)
        GROUP BY later.window_rank
      ),
      rates AS (
        SELECT
          r.later_rank,
          ROUND(r.retained_students * 100.0 / NULLIF(earlier.student_count, 0), 2) AS retention_pct
        FROM retention r
        JOIN window_totals earlier ON earlier.window_rank = r.later_rank + 1
      )
      SELECT
        MAX(CASE WHEN later_rank = 0 THEN retention_pct END) AS current_retention_pct,
        MAX(CASE WHEN later_rank = 1 THEN retention_pct END) AS previous_retention_pct,
        ROUND(
          MAX(CASE WHEN later_rank = 0 THEN retention_pct END)
          - MAX(CASE WHEN later_rank = 1 THEN retention_pct END),
          2
        ) AS retention_pct_diff
      FROM rates
    default_filters: []
    valid_dimensions: []
    synonyms: ["retention", "term-over-term retention"]
    example_questions:
      - "What's our retention rate this window vs last?"

  - id: metric.dashboard.platform_engagement.v1
    version: "1.0.0"
    display_name: Platform Engagement (last 7 days)
    description: >
      Percentage of actively enrolled students who accessed the LMS platform
      within the last 7 days, anchored on the latest observed access time,
      compared to the prior 7-day window. Originally the `platform-engagement`
      card.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-22
    entity: Person
    originally: "dashboard card: platform-engagement"
    measure_sql: |
      WITH active_students AS (
        SELECT DISTINCT pc.PERSON_ID
        FROM CDM_LMS.PERSON_COURSE pc
        JOIN CDM_LMS.COURSE c
          ON c.ID = pc.COURSE_ID
         AND c.ROW_DELETED_TIME IS NULL
        JOIN CDM_LMS.TERM t
          ON t.ID = c.TERM_ID
         AND t.ROW_DELETED_TIME IS NULL
        WHERE pc.STUDENT_IND = TRUE
          AND pc.ROW_DELETED_TIME IS NULL
          AND t.START_TIME IS NOT NULL
          AND t.END_TIME IS NOT NULL
          AND CURRENT_TIMESTAMP() BETWEEN t.START_TIME AND t.END_TIME
      ),
      as_of AS (
        SELECT MAX(ACCESSED_TIME) AS anchor_time
        FROM CDM_LMS.ACTIVITY
        WHERE ROW_DELETED_TIME IS NULL
      ),
      engaged_current AS (
        SELECT COUNT(DISTINCT a.PERSON_ID) AS engaged_count
        FROM CDM_LMS.ACTIVITY a
        JOIN active_students s ON s.PERSON_ID = a.PERSON_ID
        CROSS JOIN as_of
        WHERE a.ROW_DELETED_TIME IS NULL
          AND a.ACCESSED_TIME >  DATEADD('day', -7, as_of.anchor_time)
          AND a.ACCESSED_TIME <= as_of.anchor_time
      ),
      engaged_previous AS (
        SELECT COUNT(DISTINCT a.PERSON_ID) AS engaged_count
        FROM CDM_LMS.ACTIVITY a
        JOIN active_students s ON s.PERSON_ID = a.PERSON_ID
        CROSS JOIN as_of
        WHERE a.ROW_DELETED_TIME IS NULL
          AND a.ACCESSED_TIME >  DATEADD('day', -14, as_of.anchor_time)
          AND a.ACCESSED_TIME <= DATEADD('day', -7,  as_of.anchor_time)
      ),
      denom AS (
        SELECT COUNT(*) AS total FROM active_students
      )
      SELECT
        ROUND(ec.engaged_count * 100.0 / NULLIF(d.total, 0), 2) AS current_engagement_pct,
        ROUND(ep.engaged_count * 100.0 / NULLIF(d.total, 0), 2) AS previous_engagement_pct,
        ROUND(
          (ec.engaged_count * 100.0 / NULLIF(d.total, 0))
          - (ep.engaged_count * 100.0 / NULLIF(d.total, 0)),
          2
        ) AS engagement_pct_diff
      FROM engaged_current ec
      CROSS JOIN engaged_previous ep
      CROSS JOIN denom d
    default_filters: []
    valid_dimensions: []
    synonyms: ["platform engagement", "student activity", "login activity"]
    example_questions:
      - "How engaged are students with the platform this week?"

  - id: metric.dashboard.active_courses.v1
    version: "1.0.0"
    display_name: Active Courses (with activity this week)
    description: >
      Distinct available courses in currently running terms with at least one
      student access event in the last 7 days, compared to the prior 7-day
      window. Originally the `active-courses` card.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-22
    entity: Course
    originally: "dashboard card: active-courses"
    measure_sql: |
      WITH active_courses AS (
        SELECT c.ID AS course_id
        FROM CDM_LMS.COURSE c
        JOIN CDM_LMS.TERM t
          ON t.ID = c.TERM_ID
         AND t.ROW_DELETED_TIME IS NULL
        WHERE c.ROW_DELETED_TIME IS NULL
          AND c.AVAILABLE_IND = TRUE
          AND t.START_TIME IS NOT NULL
          AND t.END_TIME IS NOT NULL
          AND CURRENT_TIMESTAMP() BETWEEN t.START_TIME AND t.END_TIME
      ),
      as_of AS (
        SELECT MAX(ACCESSED_TIME) AS anchor_time
        FROM CDM_LMS.ACTIVITY
        WHERE ROW_DELETED_TIME IS NULL
      ),
      active_current AS (
        SELECT COUNT(DISTINCT a.COURSE_ID) AS course_count
        FROM CDM_LMS.ACTIVITY a
        JOIN active_courses ac ON ac.course_id = a.COURSE_ID
        CROSS JOIN as_of
        WHERE a.ROW_DELETED_TIME IS NULL
          AND a.ACCESSED_TIME >  DATEADD('day', -7, as_of.anchor_time)
          AND a.ACCESSED_TIME <= as_of.anchor_time
      ),
      active_previous AS (
        SELECT COUNT(DISTINCT a.COURSE_ID) AS course_count
        FROM CDM_LMS.ACTIVITY a
        JOIN active_courses ac ON ac.course_id = a.COURSE_ID
        CROSS JOIN as_of
        WHERE a.ROW_DELETED_TIME IS NULL
          AND a.ACCESSED_TIME >  DATEADD('day', -14, as_of.anchor_time)
          AND a.ACCESSED_TIME <= DATEADD('day', -7,  as_of.anchor_time)
      )
      SELECT
        ac.course_count AS current_active_courses,
        ap.course_count AS previous_active_courses,
        ac.course_count - ap.course_count AS active_courses_diff
      FROM active_current ac
      CROSS JOIN active_previous ap
    default_filters: []
    valid_dimensions: []
    synonyms: ["courses with activity", "active courses this week"]
    example_questions:
      - "How many courses have student activity this week?"

  - id: metric.dashboard.instructor_engagement.v1
    version: "1.0.0"
    display_name: Instructor Engagement (grading activity this week)
    description: >
      Percentage of active courses where a primary instructor (role 'P') or
      teaching assistant (role 'T') manually entered at least one grade in the
      last 7 days, compared to the prior 7-day window. Originally the
      `instructor-engagement` card.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-22
    entity: Course
    originally: "dashboard card: instructor-engagement"
    measure_sql: |
      WITH active_courses AS (
        SELECT c.ID AS course_id
        FROM CDM_LMS.COURSE c
        JOIN CDM_LMS.TERM t
          ON t.ID = c.TERM_ID
         AND t.ROW_DELETED_TIME IS NULL
        WHERE c.ROW_DELETED_TIME IS NULL
          AND (c.AVAILABLE_IND = TRUE OR c.AVAILABLE_TO_STUDENTS_IND = TRUE)
          AND t.START_TIME IS NOT NULL
          AND t.END_TIME IS NOT NULL
          AND CURRENT_TIMESTAMP() BETWEEN t.START_TIME AND t.END_TIME
      ),
      as_of AS (
        SELECT MAX(LAST_GRADED_TIME) AS anchor_time
        FROM CDM_LMS.GRADE
        WHERE ROW_DELETED_TIME IS NULL
      ),
      instructor_grading AS (
        SELECT
          pc.COURSE_ID,
          g.LAST_GRADED_TIME
        FROM CDM_LMS.GRADE g
        JOIN CDM_LMS.PERSON_COURSE pc
          ON pc.ID = g.PERSON_COURSE_ID
         AND pc.ROW_DELETED_TIME IS NULL
        WHERE g.ROW_DELETED_TIME IS NULL
          AND g.MANUAL_IND = TRUE
          AND g.MODIFIER_ROLE IN ('P', 'T')
          AND g.LAST_GRADED_TIME IS NOT NULL
      ),
      engaged_current AS (
        SELECT COUNT(DISTINCT ig.COURSE_ID) AS course_count
        FROM instructor_grading ig
        JOIN active_courses ac ON ac.course_id = ig.COURSE_ID
        CROSS JOIN as_of
        WHERE ig.LAST_GRADED_TIME >  DATEADD('day', -7, as_of.anchor_time)
          AND ig.LAST_GRADED_TIME <= as_of.anchor_time
      ),
      engaged_previous AS (
        SELECT COUNT(DISTINCT ig.COURSE_ID) AS course_count
        FROM instructor_grading ig
        JOIN active_courses ac ON ac.course_id = ig.COURSE_ID
        CROSS JOIN as_of
        WHERE ig.LAST_GRADED_TIME >  DATEADD('day', -14, as_of.anchor_time)
          AND ig.LAST_GRADED_TIME <= DATEADD('day', -7,  as_of.anchor_time)
      ),
      denom AS (
        SELECT COUNT(*) AS total FROM active_courses
      )
      SELECT
        ROUND(ec.course_count * 100.0 / NULLIF(d.total, 0), 2) AS current_engagement_pct,
        ROUND(ep.course_count * 100.0 / NULLIF(d.total, 0), 2) AS previous_engagement_pct,
        ROUND(
          (ec.course_count * 100.0 / NULLIF(d.total, 0))
          - (ep.course_count * 100.0 / NULLIF(d.total, 0)),
          2
        ) AS engagement_pct_diff
      FROM engaged_current ec
      CROSS JOIN engaged_previous ep
      CROSS JOIN denom d
    default_filters: []
    valid_dimensions: []
    synonyms: ["instructor engagement", "instructor grading", "RSI compliance"]
    example_questions:
      - "How many instructors have graded this week?"

  - id: metric.dashboard.classic_holdouts.v1
    version: "1.0.0"
    display_name: Classic Courses Still Active
    description: >
      Original Experience (DESIGN_MODE = 'C') courses with activity in the
      last 7 days, compared to the prior 7-day window. Tracks the Classic
      sunset; lower is better (invert_trend = true on the dashboard).
      Originally the `classic-holdouts` card.
    owner: "Blackboard"
    authority: vendor-canonical
    last_reviewed: 2026-05-22
    entity: Course
    originally: "dashboard card: classic-holdouts"
    measure_sql: |
      WITH classic_courses AS (
        SELECT c.ID AS course_id
        FROM CDM_LMS.COURSE c
        WHERE c.ROW_DELETED_TIME IS NULL
          AND (c.AVAILABLE_IND = TRUE OR c.AVAILABLE_TO_STUDENTS_IND = TRUE)
          AND c.DESIGN_MODE = 'C'
      ),
      as_of AS (
        SELECT MAX(LAST_ACCESSED_TIME) AS anchor_time
        FROM CDM_LMS.COURSE_ACTIVITY
        WHERE ROW_DELETED_TIME IS NULL
      ),
      current_window AS (
        SELECT COUNT(DISTINCT ca.COURSE_ID) AS classic_course_count
        FROM CDM_LMS.COURSE_ACTIVITY ca
        JOIN classic_courses cc ON cc.course_id = ca.COURSE_ID
        CROSS JOIN as_of
        WHERE ca.ROW_DELETED_TIME IS NULL
          AND ca.LAST_ACCESSED_TIME >  DATEADD('day', -7, as_of.anchor_time)
          AND ca.LAST_ACCESSED_TIME <= as_of.anchor_time
      ),
      previous_window AS (
        SELECT COUNT(DISTINCT ca.COURSE_ID) AS classic_course_count
        FROM CDM_LMS.COURSE_ACTIVITY ca
        JOIN classic_courses cc ON cc.course_id = ca.COURSE_ID
        CROSS JOIN as_of
        WHERE ca.ROW_DELETED_TIME IS NULL
          AND ca.LAST_ACCESSED_TIME >  DATEADD('day', -14, as_of.anchor_time)
          AND ca.LAST_ACCESSED_TIME <= DATEADD('day', -7,  as_of.anchor_time)
      )
      SELECT
        cw.classic_course_count AS current_classic_courses,
        pw.classic_course_count AS previous_classic_courses,
        cw.classic_course_count - pw.classic_course_count AS classic_courses_diff
      FROM current_window cw
      CROSS JOIN previous_window pw
    default_filters: []
    valid_dimensions: []
    synonyms: ["classic courses", "original experience holdouts"]
    example_questions:
      - "How many Classic courses still have activity?"
