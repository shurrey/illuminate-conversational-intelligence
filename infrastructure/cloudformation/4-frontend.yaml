AWSTemplateFormatVersion: '2010-09-09'
Description: 'Illuminate Frontend - S3 + CloudFront with API routing and WAF'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  BaseStackName:
    Type: String
    Default: illuminate-base-dev

  ApiStackName:
    Type: String
    Default: illuminate-api-dev

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']

Resources:
  # ===========================================
  # S3 Bucket (private, accessed via OAC)
  # ===========================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'illuminate-frontend-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ===========================================
  # Origin Access Control (replaces public bucket)
  # ===========================================

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'illuminate-frontend-oac-${Environment}'
        Description: OAC for Illuminate frontend S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ===========================================
  # CloudFront Function (SPA routing for S3 origin)
  # Rewrites non-file paths to /index.html so React Router works.
  # Only applied to the default (S3) behavior — not the API behavior.
  # ===========================================

  SpaRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'illuminate-spa-routing-${Environment}'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite non-file paths to /index.html for SPA routing
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          // If the URI has a file extension, serve it as-is (JS, CSS, images, etc.)
          if (uri.includes('.')) {
            return request;
          }
          // Otherwise rewrite to /index.html for React Router
          request.uri = '/index.html';
          return request;
        }

  # ===========================================
  # WAF (GLOBAL scope — required for CloudFront)
  # The existing REGIONAL WAF in base stack can't be used with CloudFront.
  # ===========================================

  CloudFrontWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'illuminate-cf-waf-${Environment}'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
        - Name: RateLimitRule
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: !If [IsProd, 1000, 2000]
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRule
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 2
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules:
                - Name: SizeRestrictions_BODY
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSet
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 3
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesSQLiRuleSet
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 4
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesKnownBadInputsRuleSet
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'illuminate-cf-waf-${Environment}'

  # ===========================================
  # CloudFront Distribution
  # Two origins: S3 (static) + Lambda Function URL (API)
  # ===========================================

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        WebACLId: !GetAtt CloudFrontWebACL.Arn
        PriceClass: PriceClass_100
        Origins:
          # Static frontend assets from S3
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # API routes via Lambda Function URL
          - Id: ApiOrigin
            DomainName:
              Fn::ImportValue: !Sub '${ApiStackName}-FunctionUrlDomain'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2

        # API cache behaviors (ordered — evaluated before default)
        CacheBehaviors:
          # /api/* → Lambda Function URL
          - PathPattern: '/api/*'
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            # CachingDisabled managed policy
            CachePolicyId: '4135ea2d-6df8-44a3-9df3-4b5a84be39ad'
            # AllViewerExceptHostHeader managed policy (forwards Authorization header)
            OriginRequestPolicyId: 'b689b0a8-53d0-40ab-baf2-68738e2966ac'
            Compress: true
          # /health → Lambda Function URL
          - PathPattern: '/health'
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: '4135ea2d-6df8-44a3-9df3-4b5a84be39ad'
            OriginRequestPolicyId: 'b689b0a8-53d0-40ab-baf2-68738e2966ac'

        # Default behavior: S3 static assets with SPA routing
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRoutingFunction.FunctionARN

Outputs:
  FrontendBucketName:
    Value: !Ref FrontendBucket
    Description: S3 bucket for frontend
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucket'

  CloudFrontURL:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Description: CloudFront distribution URL
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontURL'

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Description: CloudFront distribution ID

  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: CloudFront domain name (for ALLOWED_ORIGINS)
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDomain'
