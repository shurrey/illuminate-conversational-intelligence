AWSTemplateFormatVersion: '2010-09-09'
Description: 'Illuminate API - Thin proxy Lambda forwarding to AgentCore Orchestrator'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  BaseStackName:
    Type: String
    Default: illuminate-base-dev

  OrchestratorArn:
    Type: String
    Description: 'ARN of the Orchestrator AgentCore runtime (from SSM /illuminate/$ENV/orchestrator-arn).'

  FrontendOrigin:
    Type: String
    Default: ''
    Description: 'CloudFront origin URL (e.g. https://d1234.cloudfront.net). Added to CORS allowed origins.'

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']
  HasFrontendOrigin: !Not [!Equals [!Ref FrontendOrigin, '']]

Resources:
  # ===========================================
  # Lambda Role
  # ===========================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'illuminate-lambda-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: LambdaPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/illuminate_orchestrator_*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue: !Sub '${BaseStackName}-SnowflakeSecret'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub
                    - 'arn:aws:s3:::${Bucket}/*'
                    - Bucket:
                        Fn::ImportValue: !Sub '${BaseStackName}-ArtifactsBucket'
              - Effect: Allow
                Action:
                  - cognito-idp:GetUser
                  - cognito-idp:AdminGetUser
                Resource:
                  - !Sub
                    - 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'
                    - UserPoolId:
                        Fn::ImportValue: !Sub '${BaseStackName}-UserPoolId'

  # ===========================================
  # Lambda Function (Thin Proxy)
  # ===========================================

  ApiHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'illuminate-api-${Environment}'
      Runtime: python3.11
      Handler: run.sh
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      # Lambda Web Adapter — runs uvicorn inside Lambda, enables real SSE streaming
      # https://github.com/awslabs/aws-lambda-web-adapter
      Layers:
        - !Sub 'arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27'
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub '${BaseStackName}-ArtifactsBucket'
        S3Key: 'lambda/api-handler.zip'
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub '${BaseStackName}-PrivateSubnet1'
          - Fn::ImportValue: !Sub '${BaseStackName}-PrivateSubnet2'
        SecurityGroupIds:
          - Fn::ImportValue: !Sub '${BaseStackName}-SecurityGroup'
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: '/opt/bootstrap'
          PORT: '8080'
          AWS_LWA_READINESS_CHECK_PATH: '/health'
          AWS_LWA_INVOKE_MODE: 'response_stream'
          ILLUMINATE_USE_A2A: 'true'
          ORCHESTRATOR_ARN: !Ref OrchestratorArn
          ARTIFACTS_BUCKET:
            Fn::ImportValue: !Sub '${BaseStackName}-ArtifactsBucket'
          USER_POOL_ID:
            Fn::ImportValue: !Sub '${BaseStackName}-UserPoolId'
          USER_POOL_CLIENT_ID:
            Fn::ImportValue: !Sub '${BaseStackName}-UserPoolClientId'
          ALLOWED_ORIGINS: !If
            - IsProd
            - !If
              - HasFrontendOrigin
              - !Sub 'https://illuminate.anthology.com,${FrontendOrigin}'
              - 'https://illuminate.anthology.com'
            - !If
              - HasFrontendOrigin
              - !Sub 'http://localhost:3000,http://localhost:5173,${FrontendOrigin}'
              - 'http://localhost:3000,http://localhost:5173'
          ACCOUNT_ID: !Ref 'AWS::AccountId'
          A2A_TIMEOUT: '300'
          LOG_LEVEL: !If [IsProd, 'WARN', 'INFO']

  ApiHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiHandlerFunction}'
      RetentionInDays: !If [IsProd, 30, 7]

  # ===========================================
  # Lambda Function URL (single entry point for all API traffic)
  # CloudFront routes /api/* and /health here.
  # ===========================================

  # NOTE: CORS is handled by FastAPI CORSMiddleware in the Lambda code.
  # Do NOT add Cors config here — it would duplicate headers with FastAPI's.
  ApiHandlerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !Ref ApiHandlerFunction
      InvokeMode: RESPONSE_STREAM

  # Function URL requires BOTH InvokeFunctionUrl AND InvokeFunction permissions.
  # See: https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html
  ApiHandlerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiHandlerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  ApiHandlerFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiHandlerFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Value: !GetAtt ApiHandlerFunctionUrl.FunctionUrl
    Description: Lambda Function URL (all API traffic via CloudFront)
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  FunctionUrlDomain:
    Value: !Select
      - 2
      - !Split ['/', !GetAtt ApiHandlerFunctionUrl.FunctionUrl]
    Description: Function URL domain (for CloudFront origin)
    Export:
      Name: !Sub '${AWS::StackName}-FunctionUrlDomain'

  LambdaFunctionArn:
    Value: !GetAtt ApiHandlerFunction.Arn
    Description: Lambda function ARN
