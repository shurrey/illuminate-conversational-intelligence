# Snowflake MCP Server Configuration for Illuminate
# Enable all basic services for testing

other_services:
  object_manager: True
  query_manager: True
  semantic_manager: True

sql_statement_permissions:
  - Alter: False
  - Command: False
  - Comment: False
  - Commit: False
  - Create: False
  - Delete: False
  - Describe: True
  - Drop: False
  - Insert: False
  - Merge: False
  - Rollback: False
  - Select: True
  - Transaction: False
  - TruncateTable: False
  - Unknown: False
  - Update: False
  - Use: True
